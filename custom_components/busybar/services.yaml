      selector:
        number:
          min: 0
          max: 100
          mode: box
    border_width:
      advanced: true
      selector:
        number:
          min: 0
          max: 100
          mode: box
    border_color:
      advanced: true
      selector:
        text:
    align:
      default: center
      selector:
        select:
          translation_key: align
          options:
            - top_left
            - top_mid
            - top_right
            - mid_left
            - center
            - mid_right
            - bottom_left
            - bottom_mid
            - bottom_right
    x:
      selector:
        number:
          min: -4096
          max: 4095
          mode: box
    y:
      selector:
        number:
          min: -4096
          max: 4095
          mode: box
    timeout:
      selector:
        number:
          min: 0
          max: 86400
          unit_of_measurement: seconds
          mode: box
    display_until:
      advanced: true
      selector:
        text:
    z_index:
      advanced: true
      selector:
        number:
          min: 0
          max: 1000
          mode: box
    element_id:
      advanced: true
      default: ha_rectangle
      selector:
        text:
    priority:
      advanced: true
      selector:
        number:
          min: 1
          max: 100
          mode: slider
    led_color:
      selector:
        text:
    clear_first:
      advanced: true
      default: false
      selector:
        boolean:

