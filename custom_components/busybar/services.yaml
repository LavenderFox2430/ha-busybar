draw:
  target:
    device:
      integration: busybar
  fields:
    elements:
      required: true
      example: >-
        [{"id": "bg", "type": "rectangle", "display": "front", "align":
        "top_left", "x": 0, "y": 0, "width": 72, "height": 16, "fill": "solid",
        "fill_colors": ["#001133FF"], "border_width": 0}, {"id": "label",
        "type": "text", "display": "front", "align": "center", "x": 36, "y": 8,
        "text": "DEPLOYING", "font": "small", "color": "#FFCC00FF", "z_index":
        1}]
      selector:
        object:
    priority:
      selector:
        number:
          min: 1
          max: 100
          mode: slider
    led_color:
      selector:
        text:
    clear_first:
      default: false
      selector:
        boolean:

clear:
  target:
    device:
      integration: busybar
  fields:
    element_ids:
      example: '["ha_message"]'
      selector:
        object:
    everything:
      default: false
      selector:
        boolean:

play_sound:
  target:
    device:
      integration: busybar
  fields:
    stock_path:
      example: shared/sounds/beep.snd
      selector:
        text:
    path:
      example: alert.snd
      selector:
        text:

press_key:
  target:
    device:
      integration: busybar
  fields:
    key:
      required: true
      selector:
        select:
          translation_key: key
          options:
            - up
            - down
            - ok
            - back
            - start
            - busy
            - custom
            - "off"
            - apps
            - settings

start_timer:
  target:
    device:
      integration: busybar
  fields:
    slot:
      default: busy
      selector:
        select:
          translation_key: slot
          options:
            - busy
            - custom
    duration:
      example: "00:25:00"
      selector:
        duration:

stop_timer:
  target:
    device:
      integration: busybar
