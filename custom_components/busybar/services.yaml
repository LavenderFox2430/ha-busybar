draw_text:
  target:
    device:
      integration: busybar
  fields:
    text:
      required: true
      example: Meeting until 3pm
      selector:
        text:
    display:
      default: front
      selector:
        select:
          translation_key: display
          options:
            - front
            - back
    font:
      default: normal
      selector:
        select:
          translation_key: font
          options:
            - tiny
            - small
            - normal
            - condensed
            - bold
            - large
            - extra_large
            - global
            - superscript
    color:
      example: "#FF8800FF"
      selector:
        text:
    align:
      default: center
      selector:
        select:
          translation_key: align
          options:
            - top_left
            - top_mid
            - top_right
            - mid_left
            - center
            - mid_right
            - bottom_left
            - bottom_mid
            - bottom_right
    x:
      selector:
        number:
          min: -4096
          max: 4095
          mode: box
    y:
      selector:
        number:
          min: -4096
          max: 4095
          mode: box
    width:
      selector:
        number:
          min: 1
          max: 4095
          mode: box
    scroll:
      default: true
      selector:
        boolean:
    scroll_rate:
      advanced: true
      selector:
        number:
          min: 0
          max: 60000
          unit_of_measurement: px/min
          mode: box
    scroll_start_delay:
      advanced: true
      selector:
        number:
          min: 0
          max: 60000
          unit_of_measurement: ms
          mode: box
    scroll_repeat_delay:
      advanced: true
      selector:
        number:
          min: 0
          max: 60000
          unit_of_measurement: ms
          mode: box
    timeout:
      selector:
        number:
          min: 0
          max: 86400
          unit_of_measurement: seconds
          mode: box
    display_until:
      advanced: true
      selector:
        text:
    z_index:
      advanced: true
      selector:
        number:
          min: 0
          max: 1000
          mode: box
    element_id:
      advanced: true
      default: ha_message
      selector:
        text:
    priority:
      advanced: true
      selector:
        number:
          min: 1
          max: 100
          mode: slider
    led_color:
      example: "#FF0000FF"
      selector:
        text:
    clear_first:
      advanced: true
      default: false
      selector:
        boolean:

draw_countdown:
  target:
    device:
      integration: busybar
  fields:
    timestamp:
      required: true
      example: "2026-09-28 17:30:00"
      selector:
        text:
    direction:
      default: time_left
      selector:
        select:
          translation_key: direction
          options:
            - time_left
            - time_since
    show_hours:
      default: when_non_zero
      selector:
        select:
          translation_key: show_hours
          options:
            - when_non_zero
            - always
    display:
      default: front
      selector:
        select:
          translation_key: display
          options:
            - front
            - back
    color:
      example: "#00FF00FF"
      selector:
        text:
    align:
      default: center
      selector:
        select:
          translation_key: align
          options:
            - top_left
            - top_mid
            - top_right
            - mid_left
            - center
            - mid_right
            - bottom_left
            - bottom_mid
            - bottom_right
    x:
      selector:
        number:
          min: -4096
          max: 4095
          mode: box
    y:
      selector:
        number:
          min: -4096
          max: 4095
          mode: box
    timeout:
      selector:
        number:
          min: 0
          max: 86400
          unit_of_measurement: seconds
          mode: box
    display_until:
      advanced: true
      selector:
        text:
    z_index:
      advanced: true
      selector:
        number:
          min: 0
          max: 1000
          mode: box
    element_id:
      advanced: true
      default: ha_countdown
      selector:
        text:
    priority:
      advanced: true
      selector:
        number:
          min: 1
          max: 100
          mode: slider
    led_color:
      selector:
        text:
    clear_first:
      advanced: true
      default: false
      selector:
        boolean:

draw_rectangle:
